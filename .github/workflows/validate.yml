name: Validate public distribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/validate_distribution.py
      - run: python scripts/package_beginner_kit.py
      - uses: actions/upload-artifact@v6
        with:
          name: source-article-studio-beginner-kit
          path: |
            dist/source-article-studio-starter-*.zip
            dist/source-article-studio-starter-*.zip.sha256
          if-no-files-found: error
